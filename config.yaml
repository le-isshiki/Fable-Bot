exchange:
  # When true, orders go to the Binance spot testnet (https://testnet.binance.vision/).
  # Keep this true until you have validated your strategy.
  testnet: true

trading:
  symbol: BTC/USDT
  timeframe: 1h
  # Number of candles fetched each cycle (must cover the slowest indicator window).
  candle_history: 200
  # Open position and daily risk state survive restarts here.
  state_file: state.json

# Chosen from an 8000-candle (~11 month) walk-forward run on 2026-07-01:
# the most CONSISTENT well-evidenced config, not the top-ranked one.
# Test: +0.23% net of fees, 0.49% max drawdown, 14 trades, 50% win rate;
# train -0.22% — the small train/test gap is why it was picked over
# configs with better test returns but negative training performance.
strategy:
  name: trend_pullback
  params:
    trend_period: 50
    rsi_period: 14
    entry_rsi: 45.0
    exit_rsi: 60.0

risk:
  # Fraction of the quote-currency balance committed per position.
  max_position_pct: 0.10
  # Exit if price falls this far below entry.
  stop_loss_pct: 0.02
  # Exit if price rises this far above entry.
  take_profit_pct: 0.04
  # Stop opening new positions for the day after losing this fraction of starting equity.
  max_daily_loss_pct: 0.05
  # Hard floor: never place an order smaller than this much quote currency.
  min_order_quote: 10.0

loop:
  poll_interval_seconds: 60
